---
- name: Check whether Kubernetes worker is already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: k8s_worker_joined

- name: Generate Kubernetes worker join command
  ansible.builtin.command:
    cmd: kubeadm token create --print-join-command
  delegate_to: "{{ groups['master'][0] }}"
  run_once: true
  register: k8s_worker_join_command
  changed_when: false
  when: not k8s_worker_joined.stat.exists

- name: Join worker node to Kubernetes cluster
  ansible.builtin.command:
    cmd: "{{ k8s_worker_join_command.stdout }}"
  when: not k8s_worker_joined.stat.exists