---
k8s_version: "1.34"

k8s_packages:
  - kubelet
  - kubeadm
  - kubectl

k8s_apt_keyring: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

k8s_apt_repository: >-
  deb [signed-by={{ k8s_apt_keyring }}]
  https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/
  /

k8s_pod_network_cidr: "10.244.0.0/16"

k8s_service_cidr: "10.96.0.0/12"

k8s_containerd_config: /etc/containerd/config.toml

k8s_containerd_service: containerd

k8s_containerd_socket: unix:///run/containerd/containerd.sock

k8s_cni_manifest_url: >-
  https://raw.githubusercontent.com/flannel-io/flannel/master/Documentation/kube-flannel.yml

